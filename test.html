<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text Tools Test</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
    #toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1rem 0; }
    #toolbar button { padding: 0.4rem 0.8rem; cursor: pointer; }
    #toolContainer { border: 1px solid #ccc; padding: 1rem; margin-top: 1rem; border-radius: 8px; min-height: 150px; }
  </style>
</head>
<body>
  <h1>🧪 Text Tools</h1>
  <div id="toolbar">
    <button data-tool="jsonFormatter">📋 JSON Formatter</button>
    <button data-tool="wordCounter">📊 Word Counter</button>
    <button data-tool="caseConverter">🔤 Case Converter</button>
    <button data-tool="findReplace">🔍 Find & Replace</button>
    <button data-tool="removeDuplicates">🧹 Remove Duplicates</button>
    <button data-tool="jsonCsv">🔄 JSON ↔ CSV</button>
    <button data-tool="reverseText">🔄 Reverse Text</button>
  </div>
  <div id="toolContainer"><p style="color:#888;">Select a tool above.</p></div>

  <script type="module">
    const BASE_URL = '/src/index.js';
    const container = document.getElementById('toolContainer');
    const buttons = document.querySelectorAll('[data-tool]');

    async function loadTool(name) {
      container.innerHTML = `<p>⏳ Loading ${name}...</p>`;
      try {
        const mod = await import(BASE_URL);
        const fn = mod[name];
        if (typeof fn !== 'function') throw new Error(`Tool "${name}" not found`);
        container.innerHTML = '';
        fn(container);
      } catch (err) {
        container.innerHTML = `<p style="color:red;">❌ Error: ${err.message}</p>`;
        console.error(err);
      }
    }

    buttons.forEach(btn => {
      btn.addEventListener('click', () => loadTool(btn.dataset.tool));
    });

    loadTool('jsonFormatter');
  </script>
</body>
</html>
